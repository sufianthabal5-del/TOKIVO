
name: TOKIVA Free Video Encoder

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: tokiva-video-encoder
  cancel-in-progress: false

jobs:
  encode:
    name: Process queued videos
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      WORKER_NAME: github-actions-${{ github.run_id }}
      MAX_IDLE_POLLS: "3"

    steps:
      - name: Checkout TOKIVA
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install worker dependencies
        run: npm ci --prefix worker --no-audit --no-fund

      - name: Check FFmpeg
        run: ffmpeg -version

      - name: Run TOKIVA encoder
        run: node worker/index.mjs
